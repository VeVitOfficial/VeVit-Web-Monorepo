<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Font set for rendering converted DOCX: the bundled set plus the fixture fonts the source PDFs embed
     (a DOCX cannot carry PDF subset fonts; we measure reconstruction, not font availability).
     Base: isolated font set for reference renders: only the fonts the browser converter ships
     (Carlito, Caladea, Liberation) The embedded-font fixture font (../fonts-embed) is deliberately NOT listed,
     so LibreOffice has to use the font embedded in the DOCX, like the browser. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <dir prefix="relative">../fonts-embed</dir>
  <cachedir>/tmp/vevit-converter-fontconfig</cachedir>
  <!-- Metric-compatible aliases, the same table the converter uses (src/lib/converter/fonts/aliases.ts). -->
  <alias binding="same"><family>Calibri</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Cambria</family><accept><family>Caladea</family></accept></alias>
  <alias binding="same"><family>Arial</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Helvetica</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Times New Roman</family><accept><family>Liberation Serif</family></accept></alias>
  <alias binding="same"><family>Courier New</family><accept><family>Liberation Mono</family></accept></alias>
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
