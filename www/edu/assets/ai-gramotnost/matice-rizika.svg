<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Matice ověřitelnosti a ceny chyby</title><desc id="desc">Čtyři kvadranty spojují snadnost ověření s nízkou nebo vysokou cenou chyby.</desc>
  <rect width="800" height="450" rx="32" fill="#111827"/><g transform="translate(145 55)" font-family="system-ui,sans-serif"><rect width="255" height="155" fill="#166534"/><rect x="255" width="255" height="155" fill="#a16207"/><rect y="155" width="255" height="155" fill="#0369a1"/><rect x="255" y="155" width="255" height="155" fill="#991b1b"/><g fill="#fff" font-size="20" text-anchor="middle" font-weight="700"><text x="128" y="72">AI může pracovat</text><text x="128" y="103">s lehkou kontrolou</text><text x="383" y="72">AI jen s důkladnou</text><text x="383" y="103">kontrolou</text><text x="128" y="227">Snadno ověř</text><text x="128" y="258">před použitím</text><text x="383" y="227">AI nanejvýš jako</text><text x="383" y="258">první nápad</text></g></g>
  <g fill="#f8fafc" font-family="system-ui,sans-serif" font-size="20" font-weight="700"><text x="275" y="402">nízká cena chyby</text><text x="510" y="402">vysoká cena chyby</text><text transform="translate(72 315) rotate(-90)">těžko ověřitelné</text><text transform="translate(104 205) rotate(-90)">snadno ověřitelné</text></g>
</svg>
