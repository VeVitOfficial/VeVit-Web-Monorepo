<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lekce — edu.vevit.fun</title>
<link rel="stylesheet" href="/assets/fonts/vevit-fonts.css">
    <link rel="stylesheet" href="/assets/css/vevit-tailwind.css">
    <script src="/assets/vendor/lucide/lucide.min.js@latest/dist/umd/lucide.min.js"></script>

    <link rel="stylesheet" href="../css/custom.css">
    <style>
        body { font-family: 'Sora', sans-serif; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .animate-fadeUp { animation: fadeUp 0.4s ease both; }
        @keyframes toastIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
        .toast-enter { animation: toastIn 0.3s ease both; }
        #lesson-content h2 { font-weight: 700; color: #f0f0f0; font-size: 1.25rem; margin-top: 1.5rem; margin-bottom: 0.75rem; }
        #lesson-content p { color: #9ca3af; line-height: 1.75; margin-bottom: 1rem; }
        #lesson-content pre { background: #111; border: 1px solid rgba(255,255,255,0.08); border-radius: 0.75rem; padding: 1.25rem; overflow-x: auto; margin: 1rem 0; }
        #lesson-content pre code { font-family: ui-monospace, monospace; font-size: 0.875rem; color: #a3e635; }
        #lesson-content code { font-family: ui-monospace, monospace; font-size: 0.875rem; background: #1e1e1e; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; padding: 2px 6px; color: #a3e635; }
        #lesson-content ul, #lesson-content ol { color: #9ca3af; padding-left: 1.5rem; margin-bottom: 1rem; }
        #lesson-content li { margin-bottom: 0.25rem; line-height: 1.75; }
        #lesson-content strong { color: #f0f0f0; font-weight: 600; }
        #lesson-content table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        #lesson-content th { background: #1e1e1e; color: #f0f0f0; padding: 0.75rem; border: 1px solid rgba(255,255,255,0.06); text-align: left; }
        #lesson-content td { color: #9ca3af; padding: 0.75rem; border: 1px solid rgba(255,255,255,0.06); }
        #lesson-content a { color: #10b981; text-decoration: underline; }
    </style>
</head>
<body class="bg-base text-text-primary min-h-screen font-sora">

<!-- NAVBAR -->
<nav class="fixed top-0 left-0 right-0 z-50 bg-[#0d0d0d]/95 backdrop-blur-sm border-b border-white/[0.06]">
    <div class="max-w-7xl mx-auto px-3 sm:px-5 lg:px-6 h-16 flex items-center justify-between">
        <a href="../index.html" class="flex items-center gap-3 hover:opacity-90 transition-opacity">
            <div class="w-8 h-8 rounded-md bg-accent flex items-center justify-center">
                <i data-lucide="book-open" class="w-4 h-4 text-[#0d0d0d]"></i>
            </div>
            <span class="text-lg font-semibold text-text-primary">edu<span class="text-accent">.vevit</span>.fun</span>
        </a>
        <div class="flex items-center gap-3">
            <a href="https://account.vevit.fun" target="_blank" class="px-4 py-2 text-sm font-semibold text-base bg-accent hover:bg-accent-hover rounded-md transition-colors">Přihlásit se</a>
        </div>
    </div>
</nav>

<!-- MAIN -->
<div id="app" class="flex-1 pt-24 pb-28 px-3 sm:px-5 lg:px-6 max-w-3xl mx-auto w-full animate-fadeUp">
    <div id="skeleton">
        <div class="skeleton h-3 w-40 rounded mb-4"></div>
        <div class="skeleton h-4 w-24 rounded mb-6"></div>
        <div class="skeleton h-9 w-3/4 rounded mb-2"></div>
        <div class="skeleton h-4 w-1/3 rounded mb-8"></div>
        <div class="space-y-4"><div class="skeleton w-full h-4 rounded"></div><div class="skeleton w-full h-4 rounded"></div><div class="skeleton w-5/6 h-4 rounded"></div></div>
    </div>
    <div id="content" class="hidden"></div>
</div>

<!-- Sticky bottom nav -->
<div id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 z-40 bg-[#0d0d0d]/95 backdrop-blur-md border-t border-white/[0.06] px-3 sm:px-5 lg:px-6">
    <div class="max-w-3xl mx-auto flex items-center justify-between h-16 gap-3" id="bottom-nav-inner"></div>
</div>

<!-- Comments section -->
<div id="comments-section" class="max-w-3xl mx-auto mt-12 px-4 pb-20"></div>

<!-- Toast container -->
<div id="toast-container" class="fixed bottom-20 right-6 z-50 flex flex-col gap-3"></div>

<script type="module" src="lekceinline.js"></script>
</body>
</html>
