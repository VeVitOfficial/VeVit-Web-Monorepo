<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurz — edu.vevit.fun</title>
<link rel="stylesheet" href="/assets/fonts/vevit-fonts.css">
    <link rel="stylesheet" href="/assets/css/vevit-tailwind.css">
    <script src="/assets/vendor/lucide/lucide.min.js@latest/dist/umd/lucide.min.js"></script>

    <link rel="stylesheet" href="../css/custom.css">
    <style>
        body { font-family: 'Sora', sans-serif; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .animate-fadeUp { animation: fadeUp 0.4s ease both; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes progressRing { from { stroke-dashoffset: var(--circ); } to { stroke-dashoffset: var(--offset); } }
    </style>
</head>
<body class="bg-base text-text-primary min-h-screen font-sora">

<!-- NAVBAR -->
<nav class="fixed top-0 left-0 right-0 z-50 bg-[#0d0d0d]/95 backdrop-blur-sm border-b border-white/[0.06]">
    <div class="max-w-7xl mx-auto px-3 sm:px-5 lg:px-6 h-16 flex items-center justify-between">
        <a href="../index.html" class="flex items-center gap-3 hover:opacity-90 transition-opacity">
            <div class="w-8 h-8 rounded-md bg-accent flex items-center justify-center">
                <i data-lucide="book-open" class="w-4 h-4 text-[#0d0d0d]"></i>
            </div>
            <span class="text-lg font-semibold text-text-primary">edu<span class="text-accent">.vevit</span>.fun</span>
        </a>
        <div class="hidden md:flex items-center gap-6">
            <a href="../index.html" class="text-sm text-text-secondary hover:text-text-primary transition-colors">Domů</a>
            <a href="programovani.html" class="text-sm text-accent font-semibold">Kurzy</a>
        </div>
        <div class="flex items-center gap-3">
            <a href="https://account.vevit.fun" target="_blank" class="px-4 py-2 text-sm font-semibold text-base bg-accent hover:bg-accent-hover rounded-md transition-colors">Přihlásit se</a>
        </div>
    </div>
</nav>

<!-- MAIN -->
<div id="app" class="flex-1 pt-24 pb-16 px-3 sm:px-5 lg:px-6 max-w-5xl mx-auto w-full animate-fadeUp">
    <!-- Skeleton shown while loading -->
    <div id="skeleton">
        <div class="mb-8"><div class="skeleton h-5 w-28 rounded mb-4"></div></div>
        <div class="bg-[#161616] border border-[rgba(255,255,255,0.06)] rounded-2xl p-8 mb-8">
            <div class="flex items-center gap-4 mb-4"><div class="skeleton w-16 h-16 rounded-xl"></div><div class="flex-1"><div class="skeleton h-8 w-48 rounded mb-2"></div><div class="skeleton h-4 w-24 rounded"></div></div></div>
            <div class="skeleton h-4 w-full rounded mb-2"></div><div class="skeleton h-4 w-2/3 rounded"></div>
        </div>
        <div class="space-y-2">${Array(5).fill('').map(() => '<div class="skeleton h-12 w-full rounded-lg"></div>').join('')}</div>
    </div>
    <div id="content" class="hidden"></div>
</div>

<!-- Toast container -->
<div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

<script type="module" src="kurzinline.js"></script>
</body>
</html>
