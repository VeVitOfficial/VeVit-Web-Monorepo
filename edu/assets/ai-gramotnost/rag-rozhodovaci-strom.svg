    <rect x="545" y="245" width="200" height="115" rx="18" fill="#d97706"/><text x="645" y="285" fill="#fff" font-size="22" font-weight="700">Instrukce</text><text x="645" y="325" fill="#ffedd5" font-size="26">Lepší prompt</text></g>
