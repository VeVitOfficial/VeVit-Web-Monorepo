<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Rozhodovací strom RAG a fine-tuningu</title><desc id="desc">Strom doporučuje RAG pro chybějící fakta, fine-tuning pro formu a lepší prompt pro instrukce.</desc>
  <rect width="800" height="450" rx="32" fill="#101827"/><g stroke="#64748b" stroke-width="5" fill="none"><path d="M400 104v58M400 162L155 245M400 162v83M400 162l245 83"/></g>
  <g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="260" y="45" width="280" height="70" rx="18" fill="#7c3aed"/><text x="400" y="87" fill="#fff" font-size="24" font-weight="700">Co modelu chybí?</text>
