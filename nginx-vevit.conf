# =============================================================================
# Nginx konfigurace — VeVit monorepo
# Hlavní doména: vevit.cz
# Stará architektura: 5 samostatných subdomén → nové cesty pod vevit.cz/
# =============================================================================

# ─── 301 přesměrování starých subdomén ────────────────────────────────────────

server {
    listen 80;
    listen 443 ssl;
    server_name account.vevit.cz;
    # ssl_certificate / ssl_certificate_key — doplňte cestu k certifikátu
    return 301 https://vevit.cz/account$request_uri;
}

server {
    listen 80;
    listen 443 ssl;
    server_name edu.vevit.cz;
    return 301 https://vevit.cz/edu$request_uri;
}

server {
    listen 80;
    listen 443 ssl;
    server_name store.vevit.cz;
    return 301 https://vevit.cz/store$request_uri;
}

server {
    listen 80;
    listen 443 ssl;
    server_name tools.vevit.cz;
    return 301 https://vevit.cz/tools$request_uri;
}

# ─── HTTP → HTTPS redirect pro hlavní doménu ──────────────────────────────────

server {
    listen 80;
    server_name vevit.cz www.vevit.cz;
    return 301 https://vevit.cz$request_uri;
}

# ─── Hlavní server — vevit.cz (HTTPS) ────────────────────────────────────────

server {
    listen 443 ssl http2;
    server_name vevit.cz www.vevit.cz;

    # ssl_certificate      /etc/letsencrypt/live/vevit.cz/fullchain.pem;
    # ssl_certificate_key  /etc/letsencrypt/live/vevit.cz/privkey.pem;

    root /var/www/vevit-monorepo;
    index index.html index.php;

    charset utf-8;

    # Zdroj se při deployi kopíruje do uvedené absolutní cesty. Stejný include
    # je zopakován v každém bloku, který používá vlastní add_header.
    include /var/www/vevit-monorepo/config/nginx/security-headers-report-only.conf;

    # ── Cache statických assetů ───────────────────────────────────────────────
    location ~* \.(css|js|png|jpg|jpeg|webp|ico|woff2|woff|ttf|svg)$ {
        expires 7d;
        include /var/www/vevit-monorepo/config/nginx/security-headers-report-only.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Blokuj přístup k interním souborům ───────────────────────────────────
    location ~* \.(sql|env|log|bak|lock|yaml|yml|sh)$ {
        deny all;
    }
    location ~ /config\.php$ {
        deny all;
        return 404;
    }
    location ^~ /shared/ {
        deny all;
        return 404;
    }
    location ~ ^/home/(api|lib|config|tests|docs)/ {
        deny all;
    }
    location ~ ^/(store|account)/(lib|migrations|tests|docs|bin|vendor)/ {
        deny all;
    }
    location ~ ^/tools/(includes|scripts|tests)/ {
        deny all;
    }
    location ~ ^/edu/php/ {
        deny all;
    }

    # ── Root → /home redirect (Google indexuje vevit.cz → přesměruje na /home) ──
    location = / {
        return 301 https://vevit.cz/home;
    }

    # ── Portal (/home) ────────────────────────────────────────────────────────
    location /home {
        try_files $uri $uri/ /home/index.html;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    # ── Account (/account/) — PHP aplikace ───────────────────────────────────
    location /account/ {
        try_files $uri $uri/ /account/index.php$is_args$args;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;  # upravte dle verze PHP
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    # ── Edu (/edu/) — SPA (JS router, History API) ───────────────────────────
    location /edu/ {
        try_files $uri $uri/ /edu/index.html;
    }

    # Opaque playground musí být vložitelný z VeVit Edu a jako jediný potřebuje
    # Blob Worker. Stále jde jen o report-only profil.
    location = /edu/sandbox-frame.html {
        include /var/www/vevit-monorepo/config/nginx/security-headers-sandbox-report-only.conf;
        try_files $uri =404;
    }

    # Veřejné Edu API endpointy. Konfigurace a ostatní PHP zdroje zůstávají
    # mimo tento allowlist a Nginx je nikdy nevydá jako statické soubory.
    location ~ ^/edu/(?:api|ai-gramotnost/api|legacy/api)/.*\.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location ~ ^/edu/legacy/api/([a-z0-9-]+)(?:/.*)?$ {
        rewrite ^/edu/legacy/api/([a-z0-9-]+)(?:/.*)?$ /edu/legacy/api/$1.php last;
    }

    location = /account/api/csp-report.php {
        client_max_body_size 64k;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/account/api/csp-report.php;
    }

    # ── Store (/store/) — PHP aplikace ───────────────────────────────────────
    location /store/ {
        try_files $uri $uri/ @store_router;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
    location @store_router {
        # Pretty URL: /store/product/<slug> → store/product.php?slug=<slug>
        rewrite ^/store/product/([^/]+)$ /store/product.php?slug=$1 last;
        rewrite ^/store/category/([^/]+)$ /store/index.html?category=$1 last;
        return 404;
    }

    # ── Tools (/tools/) — PHP + statický HTML landing ────────────────────────
    location /tools/ {
        try_files $uri $uri/ @tools_router;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
    location @tools_router {
        # Pretty URL: /tools/<slug> → tools/tools.php?slug=<slug>
        rewrite ^/tools/([a-z0-9-]+)/?$ /tools/tools.php?slug=$1 last;
        return 404;
    }

    # ── Fallback pro statické soubory v rootu ─────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # ── PHP pro portal API ────────────────────────────────────────────────────
    location ~ ^/(api|public)/.*\.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
