name: Security preflight

on:
  push:
  pull_request:

jobs:
  secret-and-quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run secret-scan
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
