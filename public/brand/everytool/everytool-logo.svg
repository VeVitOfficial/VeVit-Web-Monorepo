<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 150" role="img" aria-label="EveryTool.cz by VeVit web applications">
  <!-- EveryTool.cz — horizontální lockup (mark + wordmark).
       Mark točená -6° jako v hlavičce aplikace. Texty vyžadují font
       Bricolage Grotesque (800) a Plus Jakarta Sans (600) z Google Fonts;
       bez nich padají na obecný sans. Pro bitmapové exporty použij
       everytool-logo.png (vyrenderováno s reálnými fonty). -->
  <title>EveryTool.cz by VeVit web applications</title>
  <g transform="translate(16 16) rotate(-6 54 54) scale(1.08)">
    <rect width="100" height="100" rx="31" fill="#1A1A2E"/>
    <rect x="19" y="19" width="26.25" height="26.25" rx="9.5" fill="#FF5A5F"/>
    <circle cx="67.875" cy="32.125" r="13.125" fill="#FFD23F"/>
    <circle cx="32.125" cy="67.875" r="13.125" fill="#2EC4B6"/>
    <rect x="54.75" y="54.75" width="26.25" height="26.25" rx="9.5" fill="#8B5CF6"/>
  </g>
  <text x="152" y="82" font-family="'Bricolage Grotesque','Plus Jakarta Sans',sans-serif" font-size="64" font-weight="800" letter-spacing="-2" fill="#1A1A2E">EveryTool<tspan fill="#5546FF">.cz</tspan></text>
  <text x="154" y="116" font-family="'Plus Jakarta Sans',sans-serif" font-size="22" font-weight="600" fill="#5B6075">by <tspan fill="#0A7D54" font-weight="700">VeVit</tspan> web applications</text>
</svg>
