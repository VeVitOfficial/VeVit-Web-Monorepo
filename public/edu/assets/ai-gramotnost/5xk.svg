  <rect width="800" height="450" rx="32" fill="#17112d"/><g font-family="system-ui,sans-serif" text-anchor="middle">
    <g transform="translate(55 115)"><rect width="130" height="185" rx="20" fill="#7c3aed"/><text x="65" y="74" fill="#fff" font-size="46" font-weight="800">K</text><text x="65" y="125" fill="#fff" font-size="23">Kdo</text></g>
    <g transform="translate(195 92)"><rect width="130" height="208" rx="20" fill="#2563eb"/><text x="65" y="86" fill="#fff" font-size="46" font-weight="800">K</text><text x="65" y="141" fill="#fff" font-size="23">Co</text></g>
    <g transform="translate(335 70)"><rect width="130" height="230" rx="20" fill="#0891b2"/><text x="65" y="96" fill="#fff" font-size="46" font-weight="800">K</text><text x="65" y="154" fill="#fff" font-size="21">K čemu</text></g>
